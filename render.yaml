services:
  # -------------------------
  # BACKEND: FastAPI
  # -------------------------
  - type: web
    name: quantum-ares-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn saas_platform.backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: quantum-ares-frontend
          envVarKey: RENDER_EXTERNAL_URL


  # -------------------------
  # FRONTEND: React (Vite)
  # -------------------------
  - type: web
    name: quantum-ares-frontend
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: quantum-ares-backend
          envVarKey: RENDER_EXTERNAL_URL